[project]
name = "comfyui-mobile-pocket"
version = "1.0.0"
description = "ComfyUI mobile UI: use ComfyUI from your phone. Gallery, queue, generate, and the full node editor tuned for touch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No extra dependencies: Pocket uses the aiohttp and Pillow that ComfyUI already ships.
dependencies = []

[project.urls]
Repository = "https://github.com/Klark61/ComfyUI-Mobile-Pocket"
Issues = "https://github.com/Klark61/ComfyUI-Mobile-Pocket/issues"

[tool.comfy]
# Fill in your Comfy Registry publisher id (https://registry.comfy.org) before running `comfy node publish`.
PublisherId = ""
DisplayName = "ComfyUI Mobile Pocket"
# SVG icon; if the registry rejects SVG, replace with a 400x400 PNG.
Icon = "https://raw.githubusercontent.com/Klark61/ComfyUI-Mobile-Pocket/main/web/pocket/icon.svg"
